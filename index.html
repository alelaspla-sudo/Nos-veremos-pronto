<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nos veremos pronto</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="screen">

    <!-- =========================
         HABITACIÓN PRINCIPAL
    ========================== -->

    <img
        src="FONDO 3.png"
        alt="Nuestra habitación"
        class="background"

    
    >





    <img
        src="Charlie.png"
        alt="Charlie"
        id="charlie"
        class="charlie"
    >

    <img
        src="Perro.png"
        alt="Perro"
        id="perro"
        class="perro"
    >

    <img
        src="Roca.png"
        alt="Roca"
        id="roca"
        class="roca"
    >

    <img
        src="Fideos.png"
        alt="Fideos"
        id="fideos"
        class="fideos"
    >

    <img
        src="Camara.png"
        alt="Camara"
        id="camara"
        class="camara"
    >


        <!-- =========================
         SISTEMA DE MENSAJES
    ========================== -->

    <div
        id="message-overlay"
        class="message-overlay"
    >

        <!-- =========================
             POST IT
        ========================== -->

        <div
            id="post-it-container"
            class="post-it-container"
        >

            <img
                src="Post it.png"
                alt="Post It"
                class="post-it"
            >

            <div
                id="post-it-text"
                class="post-it-text"
            ></div>

        </div>


        <!-- =========================
             SOBRE
        ========================== -->

        <div
            id="envelope-container"
            class="envelope-container"
        >

            <img
                src="Sobre cerrado.png"
                alt="Sobre"
                class="envelope"
            >

        </div>


        <!-- =========================
             CARTA SALIENDO DEL SOBRE
        ========================== -->

        <div
            id="letter-coming-container"
            class="letter-coming-container"
        >

            <img
                src="Sobre abierto.png"
                alt="Carta saliendo del sobre"
                class="letter-coming"
            >

        </div>


        <!-- =========================
             CARTA SOLA
        ========================== -->

        <div
            id="letter-container"
            class="letter-container"
        >

            <img
                src="cARTA.png"
                alt="Carta"
                class="letter"
            >

            <div
                id="letter-text"
                class="letter-text"
            ></div>

        </div>

    </div>
    <!-- =========================
         TOCADISCOS DE LA HABITACIÓN
    ========================== -->

    <img
        src="Tocadiscos.png"
        alt="Tocadiscos"
        id="turntable"
        class="turntable"
    >

    <!-- =========================
         INFORMACIÓN DEL DÍA
    ========================== -->

    <div
        id="day-counter"
        class="day-counter"
    ></div>

    <div
        id="countdown"
        class="countdown"
    ></div>

    <!-- =========================
         MODO TOCADISCOS
    ========================== -->

    <div
        id="record-player-mode"
        class="record-player-mode"
    >

        <!-- =========================
     EXTRA TRACK / CASETE
========================== -->

<div
    id="extra-track-mode"
    class="extra-track-mode"
>

    <!-- Fondo -->
    <img
        src="FONDO fade.png"
        alt=""
        class="extra-track-background"
    >


    <!-- CASETE -->

    <img
        src="TU-CASETE.png"
        alt="Casete"
        id="cassette"
        class="cassette"
    >


    <!-- INFORMACIÓN -->

    <div class="extra-track-info">

        <div
            id="extra-track-label"
            class="extra-track-label"
        >
            extra track.
        </div>

        <div
            id="extra-track-title"
            class="extra-track-title"
        ></div>

        <div
            id="extra-track-artist"
            class="extra-track-artist"
        ></div>

    </div>

</div>
        <!-- Fondo oscuro / transición -->

        <img
            src="FONDO fade.png"
            alt=""
            class="fade-background"
        >

        <!-- Tocadiscos ampliado -->

        <img
            src="Tocadiscos arriba.png"
            alt="Tocadiscos"
            class="floating-turntable"
        >

        <!-- Vinilo -->

        <img
            src="Disco.png"
            alt="Vinilo"
            id="vinyl"
            class="vinyl"
        >

        <!-- Información de la canción -->

        <div class="song-info">

            <div
                id="player-song-title"
                class="player-song-title"
            ></div>

            <div
                id="player-song-artist"
                class="player-song-artist"
            ></div>
        
        </div>

    
    </div>

    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="canciones.js"></script>
    <script src="script.js"></script>

</main>

</body>

</html>
